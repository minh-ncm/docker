services:
  postgres:
      image: postgres:18.3-bookworm
      ports:
        - "5432:5432"
      env_file:
        - .env
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 10s
        timeout: 5s
        retries: 5
volumes:
  postgres_data:
    driver: local