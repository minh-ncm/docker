services:
  server:
    container_name: drone-server
    restart: unless-stopped
    image: drone/drone:2.28
    ports:
      - "7080:80"
      - "7443:443"
    env_file:
      - .env
  runner:
    container_name: drone-runner
    restart: unless-stopped
    image: drone/drone-runner-docker:1.8
    depends_on:
      - server
    env_file:
      - .env